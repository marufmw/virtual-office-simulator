services:
  - type: web
    name: virtual-office
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Must match the database's region, or the internal connection string
    # won't resolve
    region: oregon
    healthCheckPath: /healthz
    envVars:
      # The database already exists, so it isn't declared here. Paste its
      # *internal* connection string into the Render dashboard once —
      # `sync: false` means the blueprint never overwrites it, and the
      # internal URL keeps the traffic inside Render's private network.
      - key: DATABASE_URL
        sync: false
      # The OAuth web client id. Not a secret, but it differs per
      # deployment, so it is filled in from the dashboard too. Its Google
      # console entry must list this service's URL as an authorized
      # JavaScript origin.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # What session tokens are signed with. Generated once and kept, so a
      # redeploy doesn't sign everybody out.
      - key: SESSION_SECRET
        generateValue: true
