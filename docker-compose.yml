# Runs the same image Render runs, against the same Render Postgres.
# DATABASE_URL comes from .env — use the external (…oregon-postgres.render.com)
# URL here, since this container is outside Render's private network.
services:
  office:
    build: .
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      PORT: 3001
